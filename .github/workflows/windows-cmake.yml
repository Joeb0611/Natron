# Natron+ Windows CMake configure + build.
# Manual dispatch only. Does not set or require NATRONPLUS_CI_ENABLED.
# Inherited installer / pacman / Tests jobs stay dispatch-only / skipped.
name: Windows CMake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cmake:
    name: Windows CMake configure + build
    runs-on: windows-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: msys2 {0}
    env:
      CI: 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-x86_64-wget unzip mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake mingw-w64-x86_64-pkg-config
      - name: Install Natron public pacman deps
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          pacman -S --needed --noconfirm --overwrite "*" mingw-w64-x86_64-natron-build-deps-qt5
      - name: CMake configure
        run: |
          export PKG_CONFIG_PATH=/mingw64/lib/pkgconfig
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNATRON_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH=/mingw64
      - name: CMake build
        run: cmake --build build --parallel 2
      - name: Verify Windows binaries
        run: |
          test -f build/App/Natron.exe
          test -f build/Renderer/NatronRenderer.exe
          test -f build/PythonBin/natron-python.exe
          ls -la build/App/Natron.exe build/Renderer/NatronRenderer.exe build/PythonBin/natron-python.exe
      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: natronplus-windows-cmake
          path: |
            build/App/Natron.exe
            build/Renderer/NatronRenderer.exe
            build/PythonBin/natron-python.exe
          if-no-files-found: error

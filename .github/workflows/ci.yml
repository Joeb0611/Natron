# Owned Natron+ CI. Manual dispatch only.
# Jobs stay skipped until repository variable NATRONPLUS_CI_ENABLED=true
# so this workflow cannot fail-mail before it can actually build.
name: CMake build

on:
  workflow_dispatch:

jobs:
  linux-cmake:
    name: Linux CMake configure + build
    if: ${{ vars.NATRONPLUS_CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CI: 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install system packages
        run: |
          sudo apt update
          sudo apt install -y build-essential cmake ninja-build \
            libboost-serialization-dev libboost-system-dev libexpat1-dev libcairo2-dev \
            qt5-qmake qtbase5-dev qtdeclarative5-dev \
            python3-dev libshiboken2-dev libpyside2-dev python3-pyside2.qtwidgets python3-qtpy \
            libwayland-dev libwayland-client0 libwayland-egl1 \
            extra-cmake-modules
      - name: CMake configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNATRON_BUILD_TESTS=OFF
      - name: CMake build
        run: cmake --build build --parallel 2

  windows-cmake:
    name: Windows CMake configure + build
    if: ${{ vars.NATRONPLUS_CI_ENABLED == 'true' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      CI: 'True'
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          submodules: recursive
      - name: Install MSYS2 packages
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git mingw-w64-x86_64-wget unzip mingw-w64-x86_64-ninja mingw-w64-x86_64-cmake
      - name: Install Natron public pacman deps
        run: |
          ${GITHUB_WORKSPACE}/.github/workflows/install_natron_pacman_repo.sh ${GITHUB_WORKSPACE} ${GITHUB_WORKSPACE}/natron_pacman_repo
          pacman -S --needed --noconfirm --overwrite "*" mingw-w64-x86_64-natron-build-deps-qt5
      - name: CMake configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNATRON_BUILD_TESTS=OFF
      - name: CMake build
        run: cmake --build build --parallel 2
